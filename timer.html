<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プレゼンタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13294B;
    --yellow: #F2B705;
    --red: #E02B2B;
    --bg1: #FFFFFF;
    --bg2: #F3F6FB;
    --ui: rgba(19, 41, 75, 0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg1);
    font-family: "Outfit", "Helvetica Neue", Arial, "Hiragino Sans", sans-serif;
    color: var(--navy);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== おしゃれな白ベース背景 ===== */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(19,41,75,0.06) 1px, transparent 0) 0 0 / 28px 28px,
      linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.55;
    animation: float 24s ease-in-out infinite alternate;
  }
  .blob.b1 { width: 48vw; height: 48vw; left: -14vw; top: -18vw; background: #DCE6F7; }
  .blob.b2 { width: 40vw; height: 40vw; right: -12vw; bottom: -16vw; background: #E9E3F5; animation-delay: -8s; }
  .blob.b3 { width: 26vw; height: 26vw; right: 18vw; top: -10vw; background: #FBEFD9; animation-delay: -16s; opacity: 0.45; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(3vw, 2vw) scale(1.08); }
  }
  .frame {
    position: fixed; inset: 2.2vmin; z-index: 1; pointer-events: none;
    border: 1px solid rgba(19,41,75,0.10); border-radius: 2.4vmin;
  }

  /* ===== 時刻表示 ===== */
  .stage {
    position: relative; z-index: 2;
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  #display {
    font-weight: 700;
    font-size: min(36vw, 70vh);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: var(--navy);
    transition: color 0.4s ease;
    white-space: nowrap;
  }
  #display .colon { display: inline-block; transform: translateY(-0.06em); margin: 0 -0.02em; }
  #display.yellow { color: var(--yellow); }
  #display.red { color: var(--red); }
  #display.done { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  /* ===== 右下コントロール ===== */
  .controls {
    position: fixed; right: 3vmin; bottom: 3vmin; z-index: 3;
    display: flex; align-items: flex-end; gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(19,41,75,0.12);
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(19,41,75,0.10);
    transition: opacity 0.4s ease;
  }
  body.running .controls { opacity: 0.12; }
  body.running .controls:hover { opacity: 1; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .group .label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--ui); }
  .pm { display: flex; gap: 6px; }
  button {
    font-family: inherit; cursor: pointer;
    border: none; border-radius: 12px;
    width: 48px; height: 48px;
    font-size: 26px; font-weight: 600; line-height: 1;
    color: var(--navy); background: #fff;
    box-shadow: inset 0 0 0 1.5px rgba(19,41,75,0.25);
    transition: background 0.15s, transform 0.08s;
  }
  button:hover { background: #EEF2F9; }
  button:active { transform: scale(0.94); }
  button:disabled { opacity: 0.3; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: rgba(19,41,75,0.15); }
  .main-btns { display: flex; gap: 8px; }
  #startBtn { width: 96px; font-size: 18px; color: #fff; background: var(--navy); box-shadow: none; }
  #startBtn:hover { background: #1E3A66; }
  #resetBtn, #fsBtn { font-size: 20px; }
  .icon { display: block; margin: auto; }
</style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="frame"></div>

  <main class="stage">
    <div id="display">05<span class="colon">:</span>00</div>
  </main>

  <div class="controls" id="controls">
    <div class="group">
      <span class="label">分</span>
      <div class="pm">
        <button class="adj" data-step="-60" title="分 −">−</button>
        <button class="adj" data-step="60" title="分 ＋">＋</button>
      </div>
    </div>
    <div class="group">
      <span class="label">秒</span>
      <div class="pm">
        <button class="adj" data-step="-1" title="秒 −">−</button>
        <button class="adj" data-step="1" title="秒 ＋">＋</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="group">
      <span class="label">操作</span>
      <div class="main-btns">
        <button id="startBtn" title="開始 / 一時停止（Space）">START</button>
        <button id="resetBtn" title="リセット（R）">↺</button>
        <button id="fsBtn" title="全画面（F）">⛶</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const MAX = 99 * 60 + 59;
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fsBtn = document.getElementById('fsBtn');
  const adjBtns = document.querySelectorAll('.adj');

  let setSeconds = 5 * 60;      // 設定時間
  let remainingMs = setSeconds * 1000;
  let endAt = 0;                 // 終了予定時刻(performance.now基準)
  let running = false;
  let finished = false;
  let lastShown = null;
  let rafId = 0;
  let wakeLock = null;

  try {
    const saved = parseInt(localStorage.getItem('presenTimer.set'), 10);
    if (saved > 0 && saved <= MAX) { setSeconds = saved; remainingMs = saved * 1000; }
  } catch (e) {}

  // ===== サウンド（Web Audio で合成：外部ファイル不要） =====
  let ctx = null;
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, vol, type = 'sine') {
    const c = audio();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }
  // 軽く短いチャイム「ピン・ポン」
  function chime() {
    const t = audio().currentTime + 0.02;
    tone(1318.5, t, 0.35, 0.25);        // E6
    tone(1046.5, t + 0.16, 0.5, 0.22);  // C6
  }
  // 終了ベル（倍音を重ねた金属的な響き × 3回）
  function bell() {
    const c = audio();
    const base = 880;
    const partials = [[1, 0.35, 2.4], [2.0, 0.18, 1.8], [2.76, 0.14, 1.4], [5.4, 0.08, 0.9], [8.93, 0.05, 0.6]];
    for (let i = 0; i < 3; i++) {
      const t = c.currentTime + 0.05 + i * 0.75;
      partials.forEach(([r, v, d]) => tone(base * r, t, d, v));
    }
  }

  // ===== 表示 =====
  function fmt(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return String(m).padStart(2, '0') + '<span class="colon">:</span>' + String(s).padStart(2, '0');
  }
  function render(sec) {
    if (sec !== lastShown) {
      display.innerHTML = fmt(sec);
      lastShown = sec;
    }
    display.classList.toggle('red', sec <= 10);
    display.classList.toggle('yellow', sec > 10 && sec <= 60);
    display.classList.toggle('done', finished);
  }
  function shownSeconds() { return Math.ceil(remainingMs / 1000); }

  // ===== タイマー制御 =====
  function tick() {
    const prev = shownSeconds();
    remainingMs = Math.max(0, endAt - performance.now());
    const now = shownSeconds();
    if (now !== prev) {
      if (prev > 30 && now <= 30 && now > 0) chime();
      if (prev > 10 && now <= 10 && now > 0) chime();
    }
    if (remainingMs <= 0) {
      running = false; finished = true;
      bell();
      updateUI();
      render(0);
      releaseWake();
      return;
    }
    render(now);
    rafId = requestAnimationFrame(tick);
  }
  function start() {
    if (finished || remainingMs <= 0) return;
    audio(); // ユーザー操作でオーディオを有効化
    endAt = performance.now() + remainingMs;
    running = true;
    updateUI();
    requestWake();
    rafId = requestAnimationFrame(tick);
  }
  function pause() {
    running = false;
    cancelAnimationFrame(rafId);
    remainingMs = Math.max(0, endAt - performance.now());
    updateUI();
    releaseWake();
  }
  function reset() {
    cancelAnimationFrame(rafId);
    running = false; finished = false;
    remainingMs = setSeconds * 1000;
    updateUI();
    render(shownSeconds());
    releaseWake();
  }
  function adjust(step) {
    if (running) return;
    const base = finished ? setSeconds : shownSeconds();
    const next = Math.min(MAX, Math.max(0, base + step));
    setSeconds = next;
    remainingMs = next * 1000;
    finished = false;
    try { localStorage.setItem('presenTimer.set', String(next)); } catch (e) {}
    updateUI();
    render(next);
  }
  function updateUI() {
    document.body.classList.toggle('running', running);
    startBtn.textContent = running ? 'PAUSE' : 'START';
    startBtn.disabled = !running && (finished || remainingMs <= 0);
    adjBtns.forEach(b => b.disabled = running);
  }

  // ===== ＋/− ボタン（長押しで連続変更） =====
  adjBtns.forEach(btn => {
    const step = parseInt(btn.dataset.step, 10);
    let timer = null, delay;
    const stop = () => { clearTimeout(timer); timer = null; };
    const repeat = () => {
      adjust(step);
      delay = Math.max(40, delay * 0.85);
      timer = setTimeout(repeat, delay);
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      adjust(step);
      delay = 140;
      timer = setTimeout(repeat, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  });

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);
  fsBtn.addEventListener('click', toggleFs);

  function toggleFs() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  // キーボード：Space=開始/停止, R=リセット, F=全画面, ↑↓=分, ←→=秒
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') toggleFs();
    else if (e.key === 'ArrowUp') { e.preventDefault(); adjust(60); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); adjust(-60); }
    else if (e.key === 'ArrowRight') adjust(1);
    else if (e.key === 'ArrowLeft') adjust(-1);
  });

  // 投影中にスクリーンがスリープしないようにする
  async function requestWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWake();
  });

  updateUI();
  render(shownSeconds());
})();
</script>
</body>
</html>
