<!--
==========================================================================
  スマホ用 下部固定ナビゲーション（KOM DESIGN LAB. 風レイアウト）
  対象：https://takabata-ekimae.com/

  ■ 使い方（WordPress の場合）
    1. 下の <style>〜</script> までを丸ごとコピー
    2. 「外観 → テーマファイルエディター → footer.php」の </body> 直前に貼り付け
       （または「Insert Headers and Footers」系プラグインのフッター欄に貼り付け）
    3. 【要編集】と書かれた箇所（リンク先・電話番号・文言）を実際の内容に置き換え
    4. 既存ハンバーガーのクラス名が下の「既存ハンバーガーを隠す」の一覧に無ければ追記

  ■ 表示ルール
    ・画面幅 768px 以下（スマホ）だけ表示。PC表示は一切変わりません。
    ・右上ハンバーガーは非表示にし、全ページへの導線は中央「メニュー」に集約。
==========================================================================
-->

<style>
  /* ---------- 色・サイズ（サイトのブランドカラーに合わせて変更可） ---------- */
  :root {
    --tbn-bar-bg: rgba(80, 80, 80, 0.94);  /* 下部バーの背景（KOM風ダークグレー） */
    --tbn-bar-fg: #ffffff;                 /* アイコン・文字色 */
    --tbn-cta-bg: #fff35c;                 /* CTA帯（KOM風イエロー） */
    --tbn-cta-fg: #3c3c3c;
    --tbn-badge: #e94c4c;                  /* 通知バッジ（赤丸） */
    --tbn-bar-h: 64px;
    --tbn-cta-h: 52px;
  }

  #tbn, #tbn-sheet, #tbn-overlay { display: none; }

  @media (max-width: 768px) {
    /* ---------- 既存ハンバーガーを隠す（テーマに合わせて追記可） ---------- */
    .hamburger, .menu-toggle, .menu-trigger, .nav-toggle, .navbar-toggler,
    .drawer-toggle, .drawer-hamburger, .c-hamburger, .l-header__menuBtn,
    .p-header__menuBtn, .sp-menu-btn, .sp-nav-btn, .header-menu-btn,
    #hamburger, #menu-toggle, #nav-toggle, #toggle, #js-hamburger {
      display: none !important;
    }

    /* 下部バーにコンテンツが隠れないよう余白を確保 */
    body { padding-bottom: calc(var(--tbn-bar-h) + var(--tbn-cta-h) + env(safe-area-inset-bottom)) !important; }

    #tbn {
      display: block;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    /* ---------- 上段：CTA帯 ---------- */
    .tbn-cta {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      height: var(--tbn-cta-h);
      background: var(--tbn-cta-bg); color: var(--tbn-cta-fg);
      font-size: 17px; font-weight: 700; letter-spacing: .08em;
      text-decoration: none;
    }
    .tbn-cta svg { width: 26px; height: 26px; flex: none; }

    /* ---------- 下段：アイコン5つ ---------- */
    .tbn-bar {
      display: grid; grid-template-columns: repeat(5, 1fr);
      height: calc(var(--tbn-bar-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--tbn-bar-bg);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .tbn-item {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      color: var(--tbn-bar-fg); text-decoration: none;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; line-height: 1;
      background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .tbn-item:active { opacity: .6; }
    .tbn-item svg { width: 26px; height: 26px; }
    .tbn-badge {
      position: absolute; top: 6px; left: calc(50% + 6px);
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--tbn-badge); color: #fff;
      font-size: 11px; line-height: 18px; text-align: center;
    }

    /* ---------- 中央「メニュー」で開く全ページ一覧 ---------- */
    #tbn-overlay {
      display: block; position: fixed; inset: 0; z-index: 9991;
      background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #tbn-sheet {
      display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9992;
      max-height: 80vh; overflow-y: auto;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      background: #fff; border-radius: 20px 20px 0 0;
      transform: translateY(100%); transition: transform .3s ease;
      font-family: inherit;
    }
    body.tbn-open #tbn-overlay { opacity: 1; pointer-events: auto; }
    body.tbn-open #tbn-sheet { transform: translateY(0); }
    body.tbn-open { overflow: hidden; }

    .tbn-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tbn-sheet-head p { margin: 0; font-weight: 700; font-size: 16px; color: #333; }
    .tbn-close { width: 40px; height: 40px; border: 0; background: none; font-size: 28px; color: #666; cursor: pointer; }
    .tbn-sheet-list { list-style: none; margin: 0; padding: 0; }
    .tbn-sheet-list a {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 4px; border-bottom: 1px solid #eee;
      color: #333; text-decoration: none; font-size: 15px; font-weight: 600;
    }
    .tbn-sheet-list a::after { content: "→"; color: #00a5c8; }
  }
</style>

<!-- 中央「メニュー」で開く全ページ一覧　【要編集】既存ハンバーガー内のリンクをここへ -->
<div id="tbn-overlay"></div>
<div id="tbn-sheet" role="dialog" aria-modal="true" aria-label="メニュー" aria-hidden="true">
  <div class="tbn-sheet-head">
    <p>MENU</p>
    <button class="tbn-close" type="button" aria-label="閉じる">&times;</button>
  </div>
  <ul class="tbn-sheet-list">
    <li><a href="/">ホーム</a></li>

    <li><a href="/news/">お知らせ</a></li>
    <li><a href="/access/">アクセス</a></li>
    <li><a href="/contact/">お問い合わせ</a></li>
  </ul>
</div>

<script>
(function () {
  var body = document.body;
  var sheet = document.getElementById('tbn-sheet');
  var btn = document.getElementById('tbn-menu-btn');

  function setOpen(open) {
    body.classList.toggle('tbn-open', open);
    btn.setAttribute('aria-expanded', open);
    sheet.setAttribute('aria-hidden', !open);
  }
  btn.addEventListener('click', function () { setOpen(!body.classList.contains('tbn-open')); });
  document.getElementById('tbn-overlay').addEventListener('click', function () { setOpen(false); });
  sheet.querySelector('.tbn-close').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
