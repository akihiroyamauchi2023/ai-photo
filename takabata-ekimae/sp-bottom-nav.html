<!--
==========================================================================
  高畑駅前接骨院 スマホ用 下部固定ナビ（KOM DESIGN LAB. 風レイアウト）
  対象：https://takabata-ekimae.com/（テーマ：takabata_orijin）

  ■ 設置方法
    1. WordPress管理画面「外観 → テーマファイルエディター」
    2. テーマ「takabata_orijin」の footer.php を開く
    3. </body> の直前に、このファイルの <style>〜</script> を丸ごと貼り付け
    ※ footer.php は全ページ共通なので、1か所の貼り付けで全ページに反映されます。
    ※ 編集前に footer.php のバックアップを必ず取ってください。

  ■ 変わること（スマホ表示のみ。PC表示は一切変わりません）
    ・右上の MENU / アクセス ボタン（.panel_area）を非表示
    ・既存の下部固定バナー（.sp_fixed_nav：電話／LINE画像）を非表示
    ・代わりに「電話・LINEのCTA帯」＋「アイコン5つの下部メニュー」を表示
    ・中央「メニュー」で全ページ一覧（旧ハンバーガーの中身）が下から開く
==========================================================================
-->

<style>
  /* ---------- 色・サイズ ---------- */
  :root {
    --tbn-bar-bg: rgba(80, 80, 80, 0.95);  /* 下部バー（KOM風ダークグレー） */
    --tbn-bar-fg: #ffffff;
    --tbn-tel-bg: #fff35c;                 /* 電話CTA（KOM風イエロー） */
    --tbn-tel-fg: #3c3c3c;
    --tbn-line-bg: #06c755;                /* LINE公式カラー */
    --tbn-line-fg: #ffffff;
    --tbn-accent: #00a5c8;
    --tbn-bar-h: 60px;
    --tbn-cta-h: 54px;
  }

  #tbn, #tbn-sheet, #tbn-overlay { display: none; }

  /* スマホ判定は JS で html に .tbn-sp を付与（このサイトは viewport 固定のため） */
  html.tbn-sp .panel_area,
  html.tbn-sp .sp_fixed_nav { display: none !important; }

  html.tbn-sp body { padding-bottom: calc((var(--tbn-bar-h) + var(--tbn-cta-h)) * var(--tbn-zoom, 1) + env(safe-area-inset-bottom)) !important; }

  /* 右下の「料金目安」丸ボタンがバーに重ならないよう持ち上げる */
  html.tbn-sp .link-price { bottom: calc((var(--tbn-bar-h) + var(--tbn-cta-h) + 12px) * var(--tbn-zoom, 1)) !important; }

  html.tbn-sp #tbn {
    display: block;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990;
    zoom: var(--tbn-zoom, 1);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  }

  /* ---------- 上段：電話／LINE の CTA 帯 ---------- */
  .tbn-cta { display: grid; grid-template-columns: 1fr 1fr; height: var(--tbn-cta-h); }
  .tbn-cta a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none; font-weight: 700; line-height: 1.2;
  }
  .tbn-cta a:active { opacity: .75; }
  .tbn-cta svg { width: 24px; height: 24px; flex: none; }
  .tbn-cta small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .02em; }
  .tbn-cta span { font-size: 15px; letter-spacing: .04em; }
  .tbn-cta .tbn-tel { background: var(--tbn-tel-bg); color: var(--tbn-tel-fg); }
  .tbn-cta .tbn-line { background: var(--tbn-line-bg); color: var(--tbn-line-fg); }

  /* ---------- 下段：アイコン5つ ---------- */
  .tbn-bar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    height: calc(var(--tbn-bar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--tbn-bar-bg);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .tbn-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    color: var(--tbn-bar-fg) !important; text-decoration: none;
    font-size: 11px; font-weight: 700; letter-spacing: .04em; line-height: 1;
    background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tbn-item:active { opacity: .6; }
  .tbn-item svg { width: 25px; height: 25px; }
  .tbn-item.is-current { color: var(--tbn-tel-bg) !important; }

  /* ---------- 中央「メニュー」で開く全ページ一覧 ---------- */
  html.tbn-sp #tbn-overlay {
    display: block; position: fixed; inset: 0; z-index: 9991;
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  html.tbn-sp #tbn-sheet {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9992;
    zoom: var(--tbn-zoom, 1);
    max-height: 80vh; overflow-y: auto;
    padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
    background: #fff; border-radius: 20px 20px 0 0;
    transform: translateY(100%); transition: transform .3s ease;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  html.tbn-open #tbn-overlay { opacity: 1; pointer-events: auto; }
  html.tbn-open #tbn-sheet { transform: translateY(0); }
  html.tbn-open, html.tbn-open body { overflow: hidden; }

  .tbn-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .tbn-sheet-head p { margin: 0; font-weight: 700; font-size: 16px; color: #333; letter-spacing: .1em; }
  .tbn-close { width: 40px; height: 40px; border: 0; background: none; font-size: 28px; color: #666; cursor: pointer; }
  .tbn-sheet-list { list-style: none; margin: 0; padding: 0; }
  .tbn-sheet-list a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 4px; border-bottom: 1px solid #eee;
    color: #333 !important; text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .tbn-sheet-list a::after { content: "→"; color: var(--tbn-accent); }
</style>

<script>
(function () {
  var html = document.documentElement;

  // スマホ判定：画面幅 768px 以下の端末。
  // このサイトは viewport が width=1024 固定の場合があるため、実画面幅との比率で文字・アイコンを等倍表示に補正する。
  function detect() {
    var sp = Math.min(screen.width, screen.height) <= 768 && window.matchMedia('(pointer: coarse)').matches;
    html.classList.toggle('tbn-sp', sp);
    var ratio = sp ? html.clientWidth / screen.width : 1;
    html.style.setProperty('--tbn-zoom', ratio > 1.2 ? ratio.toFixed(3) : 1);
  }
  detect();
  window.addEventListener('orientationchange', detect);

  // 表示中のページのアイコンを強調
  var path = location.pathname;
  document.querySelectorAll('.tbn-item[href]').forEach(function (a) {
    var p = new URL(a.href).pathname;
    if (p === '/' ? path === '/' : path.indexOf(p) === 0) a.classList.add('is-current');
  });

  var sheet = document.getElementById('tbn-sheet');
  var btn = document.getElementById('tbn-menu-btn');
  function setOpen(open) {
    html.classList.toggle('tbn-open', open);
    btn.setAttribute('aria-expanded', open);
    sheet.setAttribute('aria-hidden', !open);
  }
  btn.addEventListener('click', function () { setOpen(!html.classList.contains('tbn-open')); });
  document.getElementById('tbn-overlay').addEventListener('click', function () { setOpen(false); });
  sheet.querySelector('.tbn-close').addEventListener('click', function () { setOpen(false); });
  sheet.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
